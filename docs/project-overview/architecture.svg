<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1090" viewBox="0 0 1450 1090" role="img" aria-labelledby="title desc"><title id="title">技术架构图</title><desc id="desc">图示为日常默认端口；独立演示使用随机端口。业务库与checkpoint库分离。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/>
