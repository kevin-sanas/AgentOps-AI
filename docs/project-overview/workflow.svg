<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1350" viewBox="0 0 1460 1350" role="img" aria-labelledby="title desc"><title id="title">系统流程图：监控、诊断、人审与恢复</title><desc id="desc">监控恢复与诊断审阅并行；批准建议和回填结果都不会代替实际恢复证据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/>
<text x="30" y="36" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" fill="#0f172a" font-weight="600" text-anchor="start">系统流程图：监控、诊断、人审与恢复</text>
<text x="30" y="62" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">监控恢复与诊断审阅并行；批准建议和回填结果都不会代替实际恢复证据。</text>
<polyline points="230,175 230,245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="380,290 470,290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="590,365 590,380 420,380 420,455 380,455" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="402.0" y="383" width="72" height="19" rx="4" fill="#f8fafc"/>
<text x="438" y="397" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">未达失败阈值</text>
<polyline points="80,455 30,455 30,290 80,290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="52.0" y="373" width="48" height="19" rx="4" fill="#f8fafc"/>
<text x="76" y="387" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">下次调度</text>
<polyline points="710,290 1000,290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="808.0" y="262" width="84" height="19" rx="4" fill="#f8fafc"/>
<text x="850" y="276" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">连续失败达阈值</text>
<polyline points="1150,335 1150,410" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="1000,455 760,455" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="832.0" y="426" width="96" height="19" rx="4" fill="#f8fafc"/>
<text x="880" y="440" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">有权限的人员发起</text>
<polyline points="610,500 610,615" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="610,715 610,795" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="490,870 230,870 230,1015" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300.0" y="841" width="84" height="19" rx="4" fill="#f8fafc"/>
<text x="342" y="855" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">拒绝并记录理由</text>
<polyline points="610,945 610,1015" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="640.0" y="972" width="84" height="19" rx="4" fill="#f8fafc"/>
<text x="682" y="986" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">批准并记录理由</text>
<polyline points="610,1105 610,1200" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="1150,500 1150,615" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1174.0" y="551" width="72" height="19" rx="4" fill="#f8fafc"/>
<text x="1210" y="565" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">持续健康检查</text>
<polyline points="1150,715 1150,820" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1184.0" y="763" width="72" height="19" rx="4" fill="#f8fafc"/>
<text x="1220" y="777" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">达到恢复阈值</text>
<polyline points="1150,910 1150,1015" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1183.0" y="953" width="120" height="19" rx="4" fill="#f8fafc"/>
<text x="1243" y="967" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">观察期间再次满足阈值</text>
<polyline points="1150,1105 1150,1200" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1189.0" y="1146" width="72" height="19" rx="4" fill="#f8fafc"/>
<text x="1225" y="1160" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">人工确认关闭</text>
<rect x="80" y="90" width="300" height="85" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M92,91 H368" stroke="#5b8cff" stroke-width="3"/>
<text x="96" y="117" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">登记服务并启用检查</text>
<text x="96" y="141" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">登记目标 / 网络审批 / ACL</text>
<rect x="80" y="245" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M92,246 H368" stroke="#5b8cff" stroke-width="3"/>
<text x="96" y="272" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">调度并保存检查结果</text>
<text x="96" y="296" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">日常HTTP / 演示合成样本</text>
<polygon points="590.0,215 710,290.0 590.0,365 470,290.0" fill="#eff6ff" stroke="#94a3b8"/>
<text x="590.0" y="287.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle">失败计数判定</text>
<text x="590.0" y="310.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#334155" font-weight="400" text-anchor="middle">累计当前版本连续失败</text>
<rect x="80" y="410" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M92,411 H368" stroke="#5b8cff" stroke-width="3"/>
<text x="96" y="437" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">更新快照和检查历史</text>
<text x="96" y="461" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">正常、异常、未知分别展示</text>
<rect x="1000" y="245" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M1012,246 H1288" stroke="#5b8cff" stroke-width="3"/>
<text x="1016" y="272" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">创建唯一活动事故</text>
<text x="1016" y="296" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">OPEN / 冻结检查快照</text>
<rect x="1000" y="410" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M1012,411 H1288" stroke="#5b8cff" stroke-width="3"/>
<text x="1016" y="437" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">确认事故并开始排查</text>
<text x="1016" y="461" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">ACKNOWLEDGED → INVESTIGATING</text>
<rect x="460" y="410" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M472,411 H748" stroke="#5b8cff" stroke-width="3"/>
<text x="476" y="437" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">Java创建诊断任务与Outbox</text>
<text x="476" y="461" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">授权 / 冻结检查和手册</text>
<rect x="460" y="615" width="300" height="100" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M472,616 H748" stroke="#5b8cff" stroke-width="3"/>
<text x="476" y="642" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">Python只读诊断与校验</text>
<text x="476" y="666" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">validate/context/retrieval/analyze</text>
<text x="476" y="685" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">guard通过后等待人工审阅</text>
<polygon points="610.0,795 730,870.0 610.0,945 490,870.0" fill="#eff6ff" stroke="#94a3b8"/>
<text x="610.0" y="867.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle">人工审阅决定</text>
<text x="610.0" y="890.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#334155" font-weight="400" text-anchor="middle">报告和引用均已冻结</text>
<rect x="80" y="1015" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M92,1016 H368" stroke="#5b8cff" stroke-width="3"/>
<text x="96" y="1042" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">拒绝 / 到期取消</text>
<text x="96" y="1066" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">保留决定，停止线下处理流程</text>
<rect x="460" y="1015" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M472,1016 H748" stroke="#5b8cff" stroke-width="3"/>
<text x="476" y="1042" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">批准线下处理 / 恢复断点</text>
<text x="476" y="1066" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">平台不执行建议命令</text>
<rect x="460" y="1200" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M472,1201 H748" stroke="#5b8cff" stroke-width="3"/>
<text x="476" y="1227" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">人员如实回填线下结果</text>
<text x="476" y="1251" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">已执行 / 未执行 / 失败</text>
<rect x="1000" y="615" width="300" height="100" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M1012,616 H1288" stroke="#5b8cff" stroke-width="3"/>
<text x="1016" y="642" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">实际检查连续恢复</text>
<text x="1016" y="666" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">必须基于冻结检查与阈值</text>
<text x="1016" y="685" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">暂停或再失败会中断观察</text>
<rect x="1000" y="820" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M1012,821 H1288" stroke="#5b8cff" stroke-width="3"/>
<text x="1016" y="847" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">恢复观察 MONITORING</text>
<text x="1016" y="871" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">继续检查，不能直接视作解决</text>
<rect x="1000" y="1015" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M1012,1016 H1288" stroke="#5b8cff" stroke-width="3"/>
<text x="1016" y="1042" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">已解决 RESOLVED</text>
<text x="1016" y="1066" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">恢复证据满足观察要求</text>
<rect x="1000" y="1200" width="300" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M1012,1201 H1288" stroke="#5b8cff" stroke-width="3"/>
<text x="1016" y="1227" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">已关闭 CLOSED</text>
<text x="1016" y="1251" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">人工关闭并保留完整时间线</text>
<text x="30" y="1325" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">诊断校验失败显示失败；模型结果不确定时停止自动重发。所有事故、决定、回填和投递均可追溯。</text>
</svg>