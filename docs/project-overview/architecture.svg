<text x="1026" y="947" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a" font-weight="600" text-anchor="start">模型服务（可选）</text>
<text x="1026" y="971" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">DeepSeek / 严格JSON兼容API</text>
