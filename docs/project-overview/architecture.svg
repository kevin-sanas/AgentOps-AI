<text x="1026" y="351" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">FastAPI内部认证 / LangGraph</text>
<text x="1026" y="370" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#334155" font-weight="400" text-anchor="start">结构、引用、秘密与风险校验</text>
