name: application-verify
on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked Python agent test environment
        run: |
          python -m venv agent-service/.venv
          agent-service/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r agent-service/requirements-dev.lock
      - name: Verify read-only graph contracts
        working-directory: agent-service
        run: .venv/bin/python -m pytest tests/test_graph.py tests/test_review.py tests/test_provider.py tests/test_scenarios.py -q -p no:cacheprovider
      - name: Compile and run PostgreSQL and probe tests
        run: |
          mkdir -p backend/target/tmp
          mvn -B -ntp -Dmaven.repo.local="$GITHUB_WORKSPACE/.cache/m2" -f backend/pom.xml verify
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: npm run build
      - run: node --test ../scripts/demo-target.test.mjs
      - run: npm audit --audit-level=low
      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: agentops-ci
      BACKEND_PORT: '18184'
      FRONTEND_PORT: '5184'
      AGENT_ENABLED: 'true'
      AGENT_LLM_PROVIDER: mock
      AGENT_MODEL_NAME: mock
      KUMA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated CI credentials
        shell: python
        run: |
          import os, secrets
          names = ['DB_PASSWORD','SESSION_TOKEN_PEPPER','AGENT_INTERNAL_TOKEN','BOOTSTRAP_ADMIN_PASSWORD','CHECKPOINT_OWNER_PASSWORD','CHECKPOINT_PASSWORD']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name in names:
                  value = secrets.token_hex(24)
                  print('::add-mask::' + value)
                  output.write(name + '=' + value + '\n')
      - name: Validate and start isolated mock stack
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18184/actuator/health | python -c 'import json,sys;assert json.load(sys.stdin)["status"]=="UP"'; then break; fi
            if [ "$attempt" = 60 ]; then exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5184/login > /dev/null
          curl --fail --silent http://127.0.0.1:5184/healthz
      - name: Isolated PostgreSQL dump and restore drill
        shell: pwsh
        run: ./scripts/recovery-drill.ps1
      - name: Remove only this job's containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
